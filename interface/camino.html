<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
  <title>The Sovereign's Path · Aurelius</title>
  <style>
    :root {
      --fondo: #1a1a1a; --panel: #201d26; --vena: #a97bff; --vena-tenue: #6b4fa0;
      --ambar: #f6a723; --texto: #e8e4dc; --tenue: #9a94a8; --ok: #7bd88f; --error: #ff6b6b;
      --code: #14121a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, #241f2e 0%, var(--fondo) 60%);
      color: var(--texto); font-family: "Georgia", serif; min-height: 100vh;
      padding: 0 0 48px;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      border-bottom: 1px solid var(--vena-tenue);
      background: linear-gradient(90deg, rgba(169,123,255,0.08), transparent);
      position: sticky; top: 0; z-index: 5; backdrop-filter: blur(6px);
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: 0.03em; }
    header .salut { color: var(--vena); font: 500 14px/1 ui-monospace, monospace; white-space: nowrap; }
    .cm-lang { margin-left: auto; background: var(--code); color: var(--texto); border: 1px solid var(--vena-tenue); border-radius: 8px; padding: 8px 10px; font: 600 13px/1 ui-monospace, monospace; cursor: pointer; min-height: 40px; }
    .cm-lang:focus-visible { outline: 2px solid var(--vena); outline-offset: 2px; }
    a.retour { color: var(--tenue); font: 500 12px/1 ui-monospace, monospace; text-decoration: none; border: 1px solid var(--vena-tenue); border-radius: 8px; padding: 0 12px; min-height: 40px; display: inline-flex; align-items: center; white-space: nowrap; }
    a.retour:hover { color: var(--texto); border-color: var(--vena); }
    .cm-noverif { font: 500 10px/1 ui-monospace, monospace; color: var(--ambar); white-space: nowrap; }
    main { max-width: 760px; margin: 0 auto; padding: 20px; }

    .rail { display: flex; gap: 8px; margin-bottom: 22px; overflow-x: auto; padding-bottom: 4px; }
    .etape {
      flex: 0 0 auto; min-width: 92px; text-align: center; padding: 10px 8px; border-radius: 10px;
      border: 1px solid var(--vena-tenue); font: 600 12px/1.3 ui-monospace, monospace; color: var(--tenue);
      background: #17141d;
    }
    .etape[data-etat="fait"] { color: var(--ok); border-color: var(--ok); }
    .etape[data-etat="actuel"] { color: var(--ambar); border-color: var(--ambar); box-shadow: 0 0 14px rgba(246,167,35,0.25); }
    .etape small { display: block; font-weight: 400; color: inherit; opacity: 0.8; }

    .module {
      background: var(--panel); border: 1px solid var(--vena-tenue); border-left: 3px solid var(--vena);
      border-radius: 14px; padding: 20px; margin-bottom: 16px;
    }
    .module h2 { margin: 0 0 6px; font-size: 22px; }
    .module .obj { color: var(--tenue); font-style: italic; margin: 0 0 14px; }
    ol.pasos { margin: 0 0 14px; padding-left: 20px; line-height: 1.6; }
    ol.pasos li { margin-bottom: 6px; }
    .bloc { margin: 12px 0; }
    .bloc-titre { font: 600 12px/1 ui-monospace, monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--vena); margin-bottom: 6px; }
    pre.cmd {
      position: relative; background: var(--code); border: 1px solid var(--vena-tenue); border-radius: 8px;
      padding: 12px 52px 12px 12px; margin: 0; overflow-x: auto;
      font: 400 13px/1.5 ui-monospace, "SFMono-Regular", monospace; color: #d7ffd7; white-space: pre-wrap; word-break: break-word;
    }
    button.copier {
      position: absolute; top: 6px; right: 6px; background: var(--vena-tenue); color: var(--fondo);
      border: none; border-radius: 6px; font: 700 10px/1 ui-monospace, monospace; padding: 8px 8px; cursor: pointer; min-height: 40px;
    }
    button.copier:hover { background: var(--vena); }
    .champ { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    input[type="text"], input[type="file"] {
      flex: 1 1 240px; background: var(--code); color: var(--texto); border: 1px solid var(--vena-tenue);
      border-radius: 8px; padding: 10px; font: 400 14px/1 ui-monospace, monospace;
    }
    button.action {
      background: var(--vena); color: var(--fondo); border: none; border-radius: 8px; font: 700 13px/1 ui-monospace, monospace;
      padding: 12px 18px; cursor: pointer; min-height: 44px;
    }
    button.action:hover:not(:disabled) { filter: brightness(1.12); }
    button.action:disabled { opacity: 0.5; cursor: progress; }
    .aviso { margin-top: 10px; font: 400 13px/1.5 ui-monospace, monospace; }
    .aviso.ok { color: var(--ok); }
    .aviso.err { color: var(--error); }
    .prompt-cebado { background: var(--code); border: 1px dashed var(--vena-tenue); border-radius: 8px; padding: 12px; color: #efe7ff; font: italic 400 14px/1.6 "Georgia", serif; }
    .fait-note { color: var(--ok); font: 500 13px/1.5 ui-monospace, monospace; }
    .verrou { opacity: 0.5; }

    @media (max-width: 600px) {
      header { gap: 8px; padding: 12px 14px; }
      header h1 { font-size: 16px; }
      .salut { display: none; } /* el saludo se recupera en el módulo; el header queda a 1 fila */
      .cm-lang { padding: 6px 8px; min-height: 44px; }
      a.retour { min-height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="cm-titulo">The Sovereign's Path</h1>
    <span class="salut" id="salut"></span>
    <select class="cm-lang" id="cm-lang" aria-label="Language"></select>
    <span class="cm-noverif" id="cm-noverif" hidden>⚠ auto</span>
    <a class="retour" id="cm-retour" href="aurelius_face.html">← Aurelius</a>
  </header>
  <main>
    <div class="rail" id="rail"></div>
    <div id="zone"></div>
  </main>

  <script src="i18n.js"></script>
  <script>
    "use strict";
    (function () {
      var I = window.AURELIUS_I18N;
      var API = ""; // mismo origen (servidor 8050)
      var VAULT = "~/aurelius/sovereign_vault";
      var SCRIPTS = "~/aurelius/scripts";
      var MODELO = "qwen3:30b-a3b-instruct-2507-q4_K_M"; // el modelo local presente; cualquiera vale

      // === Identidad del soberano (multiusuario · SEPARACIÓN, no auth). El slug
      //     vive en localStorage (lo fija la cara o el Tótem M0) y viaja en
      //     ?soberano= a la API. Cualquiera con el enlace puede poner otro nombre. ===
      function slugSoberano() {
        try { return localStorage.getItem("aurelius.soberano") || null; } catch (e) { return null; }
      }
      function fijarSlug(slug, nombre) {
        try {
          if (slug) localStorage.setItem("aurelius.soberano", slug);
          if (nombre) localStorage.setItem("aurelius.nombre", nombre.trim());
        } catch (e) { /* memoria */ }
      }
      function apiUrl(path) {
        var s = slugSoberano();
        return s ? path + (path.indexOf("?") >= 0 ? "&" : "?") + "soberano=" + encodeURIComponent(s) : path;
      }

      var CAMINO = ["M0", "M1", "M2", "M3", "M4", "M5"];

      var zone = document.getElementById("zone");
      var rail = document.getElementById("rail");
      var salut = document.getElementById("salut");
      var titulo = document.getElementById("cm-titulo");
      var noverif = document.getElementById("cm-noverif");
      var sel = document.getElementById("cm-lang");

      function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

      // === i18n: poblar selector, aplicar idioma a los elementos estáticos ===
      (function poblarSelector() {
        I.locales.forEach(function (loc) {
          var o = document.createElement("option");
          o.value = loc; o.textContent = I.nombre[loc];
          sel.appendChild(o);
        });
      })();

      function aplicarIdioma() {
        document.documentElement.lang = I.locale;
        titulo.textContent = I.t("path.title");
        titulo.parentElement && (document.title = I.t("path.title") + " · Aurelius");
        document.getElementById("cm-retour").textContent = I.t("path.back");
        if (sel.value !== I.locale) sel.value = I.locale;
        noverif.hidden = I.esVerificado(); // aviso honesto: idioma sin revisar humano
      }

      sel.addEventListener("change", function (ev) {
        I.set(ev.target.value);
        aplicarIdioma();
        render(); // re-pinta las vistas en el nuevo idioma
      });

      function bloc(titre, cmd) {
        return '<div class="bloc"><div class="bloc-titre">' + esc(titre) + '</div>' +
          '<pre class="cmd"><button class="copier" type="button">' + esc(I.t("copy")) + '</button>' +
          '<span class="cmd-txt">' + esc(cmd) + '</span></pre></div>';
      }

      function cablerCopieurs(scope) {
        scope.querySelectorAll("button.copier").forEach(function (b) {
          b.addEventListener("click", function () {
            var pre = b.parentElement;
            var span = pre.querySelector(".cmd-txt");
            var txt = span ? span.textContent : pre.textContent.replace(new RegExp("^" + I.t("copy")), "");
            copiar(txt, b, span);
          });
        });
      }

      // Copia ROBUSTA en contexto NO seguro: Aurelius se sirve por http:// vía el
      // hostname del tailnet (≠ localhost), así que navigator.clipboard está
      // BLOQUEADO por el navegador (mismo motivo que el micrófono). Fallback a
      // execCommand con un textarea temporal; si tampoco, se SELECCIONA el
      // comando visible para copia manual con teclado. Se marca "copiado" SOLO si
      // de verdad copió — un botón que miente (el paso falla en silencio) es peor
      // que ninguno. El comando SIEMPRE queda visible y legible (IronClaw: se lee
      // antes de ejecutar).
      function copiar(txt, btn, span) {
        function marca(clave, ms) {
          btn.textContent = I.t(clave);
          setTimeout(function () { btn.textContent = I.t("copy"); }, ms || 1200);
        }
        function manual() {
          if (span) {
            var r = document.createRange(); r.selectNodeContents(span);
            var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          }
          marca("copyManual", 3000);
        }
        if (window.isSecureContext && navigator.clipboard) {
          navigator.clipboard.writeText(txt).then(function () { marca("copyOk"); }).catch(manual);
          return;
        }
        var ta = document.createElement("textarea");
        ta.value = txt; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        if (ok) marca("copyOk"); else manual();
      }

      async function getEstado() {
        var r = await fetch(apiUrl(API + "/api/estado"));
        return r.json();
      }

      function pintarRail(estado) {
        rail.innerHTML = "";
        CAMINO.forEach(function (code) {
          var etat = estado.modulos_completados.indexOf(code) >= 0 ? "fait"
            : (estado.modulo_actual === code ? "actuel" : "attente");
          var d = document.createElement("div");
          d.className = "etape"; d.setAttribute("data-etat", etat);
          d.innerHTML = esc(code) + "<small>" + esc(I.t("step." + code)) + "</small>";
          rail.appendChild(d);
        });
      }

      // ---------- M0 · El Tótem ----------
      function vueM0() {
        return '<div class="module"><h2>' + esc(I.t("m0.title")) + '</h2>'
          + '<p class="obj">' + esc(I.t("m0.obj")) + '</p>'
          + '<ol class="pasos"><li>' + esc(I.t("m0.step1")) + '</li></ol>'
          + '<div class="prompt-cebado">' + esc(I.t("m0.prompt")) + '</div>'
          + '<ol class="pasos" start="2"><li>' + esc(I.t("m0.step2")) + '</li></ol>'
          + '<div class="champ">'
          + '<input type="text" id="m0-nom" placeholder="' + esc(I.t("m0.nom")) + '" />'
          + '<input type="file" id="m0-file" accept="image/png,image/jpeg,image/webp" />'
          + '<button class="action" id="m0-btn">' + esc(I.t("m0.btn")) + '</button>'
          + '</div><div class="aviso" id="m0-aviso"></div></div>';
      }
      function cablerM0() {
        var btn = document.getElementById("m0-btn");
        var aviso = document.getElementById("m0-aviso");
        btn.addEventListener("click", async function () {
          var nom = document.getElementById("m0-nom").value.trim();
          var file = document.getElementById("m0-file").files[0];
          if (nom === "") { aviso.className = "aviso err"; aviso.textContent = I.t("m0.errName"); return; }
          if (!file) { aviso.className = "aviso err"; aviso.textContent = I.t("m0.errFile"); return; }
          var ext = (file.name.split(".").pop() || "png").toLowerCase();
          btn.disabled = true; aviso.className = "aviso"; aviso.textContent = I.t("m0.sealing");
          try {
            var buf = await file.arrayBuffer();
            var r = await fetch(API + "/api/totem", {
              method: "POST", headers: { "X-Nombre": nom, "X-Ext": ext }, body: buf,
            });
            var j = await r.json();
            if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
            fijarSlug(j.slug, nom); // el servidor devuelve el slug: lo recordamos
            aviso.className = "aviso ok";
            aviso.textContent = I.t("m0.sealed", { sha: j.sha256.slice(0, 12), name: nom });
            setTimeout(render, 900);
          } catch (e) {
            aviso.className = "aviso err"; aviso.textContent = "— " + e.message;
            btn.disabled = false;
          }
        });
      }

      // ---------- M1 · El Fuego ----------
      function vueM1() {
        var art = VAULT + "/M1_Espejo_Roto/tiempo_perdido.md";
        return '<div class="module"><h2>' + esc(I.t("m1.title")) + '</h2>'
          + '<p class="obj">' + esc(I.t("m1.obj")) + '</p>'
          + '<ol class="pasos"><li>' + esc(I.t("m1.step1")) + '</li><li>' + esc(I.t("m1.step2")) + '</li></ol>'
          + bloc(I.t("m1.cmd1"), 'mkdir -p ' + VAULT + '/M1_Espejo_Roto\nollama run ' + MODELO + ' "Dame un plan de 3 pasos, simple y seguro, para empezar un pequeno huerto en un balcon." > ' + art)
          + '<ol class="pasos" start="3"><li>' + esc(I.t("m1.step3")) + '</li></ol>'
          + bloc(I.t("m1.cmd2"), 'python3 ' + SCRIPTS + '/firmar_artefacto.py ' + art)
          + '<p class="obj">' + esc(I.t("m1.paste")) + '</p>'
          + '<div class="champ"><input type="text" id="m1-sha" placeholder="' + esc(I.t("m1.sha")) + '" />'
          + '<button class="action" id="m1-btn">' + esc(I.t("m1.btn")) + '</button></div>'
          + '<div class="aviso" id="m1-aviso"></div></div>';
      }

      // ---------- M2 · El Agua ----------
      function vueM2() {
        var gri = VAULT + "/M2_Agua/grimorio.md";
        var man = VAULT + "/M2_Agua/grimorio.manifest.json";
        return '<div class="module"><h2>' + esc(I.t("m2.title")) + '</h2>'
          + '<p class="obj">' + esc(I.t("m2.obj")) + '</p>'
          + '<ol class="pasos"><li>' + esc(I.t("m2.step1")) + '</li></ol>'
          + bloc(I.t("m2.cmd1"), 'mkdir -p ' + VAULT + '/M2_Agua\nnano ' + gri)
          + '<ol class="pasos" start="2"><li>' + esc(I.t("m2.step2")) + '</li></ol>'
          + bloc(I.t("m2.cmd2"), 'python3 ' + SCRIPTS + '/ingerir.py ' + gri)
          + '<ol class="pasos" start="3"><li>' + esc(I.t("m2.step3")) + '</li></ol>'
          + bloc(I.t("m2.cmd3"), 'python3 ' + SCRIPTS + '/ingerir.py ' + gri + ' --buscar "tu pregunta"')
          + '<ol class="pasos" start="4"><li>' + esc(I.t("m2.step4")) + '</li></ol>'
          + bloc(I.t("m2.cmd4"), 'python3 ' + SCRIPTS + '/firmar_artefacto.py ' + man)
          + '<p class="obj">' + esc(I.t("m2.paste")) + '</p>'
          + '<div class="champ"><input type="text" id="m2-sha" placeholder="' + esc(I.t("m1.sha")) + '" />'
          + '<button class="action" id="m2-btn">' + esc(I.t("m2.btn")) + '</button></div>'
          + '<div class="aviso" id="m2-aviso"></div></div>';
      }

      function cablerCompletar(code, btnId, shaId, avisoId) {
        var btn = document.getElementById(btnId);
        var aviso = document.getElementById(avisoId);
        btn.addEventListener("click", async function () {
          var sha = (document.getElementById(shaId).value || "").trim().toLowerCase();
          if (!/^[0-9a-f]{64}$/.test(sha)) {
            aviso.className = "aviso err"; aviso.textContent = I.t("seal.badSha");
            return;
          }
          btn.disabled = true; aviso.className = "aviso"; aviso.textContent = I.t("seal.sealing");
          try {
            var r = await fetch(apiUrl(API + "/api/modulo/completar"), {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ modulo: code, prueba: sha }),
            });
            var j = await r.json();
            if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
            aviso.className = "aviso ok"; aviso.textContent = I.t("seal.ok", { code: code });
            setTimeout(render, 900);
          } catch (e) {
            aviso.className = "aviso err"; aviso.textContent = "— " + e.message;
            btn.disabled = false;
          }
        });
      }

      function vueFinal() {
        return '<div class="module"><h2>' + esc(I.t("final.title")) + '</h2>'
          + '<p class="obj">' + esc(I.t("final.body")) + '</p></div>';
      }

      async function render() {
        var estado;
        try { estado = await getEstado(); }
        catch (e) {
          zone.innerHTML = '<div class="module"><h2>' + esc(I.t("path.serverDown.title")) + '</h2>'
            + '<p class="obj">' + esc(I.t("path.serverDown.body")) + '</p></div>';
          return;
        }
        salut.textContent = estado.nombre ? (I.t("path.greet") + estado.nombre) : "";
        pintarRail(estado);
        var act = estado.modulo_actual;
        var html;
        if (act === "M0") { html = vueM0(); }
        else if (act === "M1") { html = vueM1(); }
        else if (act === "M2") { html = vueM2(); }
        else { html = vueFinal(); }
        zone.innerHTML = html;
        cablerCopieurs(zone);
        if (act === "M0") cablerM0();
        else if (act === "M1") cablerCompletar("M1", "m1-btn", "m1-sha", "m1-aviso");
        else if (act === "M2") cablerCompletar("M2", "m2-btn", "m2-sha", "m2-aviso");
      }

      aplicarIdioma();
      render();
    })();
  </script>
</body>
</html>
